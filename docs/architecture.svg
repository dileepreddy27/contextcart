<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="360" viewBox="0 0 1000 360"><rect width="1000" height="360" fill="#f3f5ef"/><g font-family="sans-serif" fill="#16312c"><text x="40" y="48" font-size="28" font-weight="bold">ContextCart · an inspectable recommendation pipeline</text><g fill="#fff" stroke="#83a88d" stroke-width="2"><rect x="40" y="100" width="180" height="90" rx="12"/><rect x="290" y="85" width="190" height="65" rx="12"/><rect x="290" y="175" width="190" height="65" rx="12"/><rect x="550" y="115" width="180" height="90" rx="12"/><rect x="790" y="115" width="170" height="90" rx="12"/></g><g font-size="17"><text x="62" y="136">Query + session</text><text x="62" y="163">Redis / memory</text><text x="312" y="124">BM25 retrieval</text><text x="310" y="212">Vector retrieval</text><text x="570" y="151">Weighted RRF</text><text x="570" y="179">Stock / price filter</text><text x="809" y="151">Optional Cohere</text><text x="809" y="179">reranking</text></g><g stroke="#17533d" stroke-width="3" fill="none"><path d="M220 145 L255 145 L255 118 L290 118 M255 145 L255 207 L290 207 M480 118 L512 118 L512 160 L550 160 M480 207 L512 207 L512 160 M730 160 L790 160"/></g><text x="40" y="293" font-size="17">Local: deterministic hashed vectors + exact cosine search. Cloud: Cohere embeddings + Pinecone.</text><text x="40" y="324" font-size="15">Clicks update an expiring session vector. Scores are relevance signals, not conversion probabilities.</text></g></svg>