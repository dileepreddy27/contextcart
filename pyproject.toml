[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "contextcart"
version = "0.1.0"
description = "Inspectable hybrid product recommendations with session context"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.115,<1", "uvicorn>=0.30,<1", "numpy>=1.26,<3", "httpx>=0.27,<1"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.9,<1", "fakeredis>=2.26,<3"]
redis = ["redis>=5,<7"]

[tool.setuptools.package-data]
contextcart = ["data/*.json", "static/*"]

[tool.ruff]
line-length = 110
[tool.setuptools.packages.find]
include = ["contextcart*"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

